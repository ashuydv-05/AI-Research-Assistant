services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arxiv_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./data/evaluation:/app/data/evaluation
    restart: unless-stopped
    networks:
      - arxiv-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arxiv_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - arxiv-network

networks:
  arxiv-network:
    driver: bridge
